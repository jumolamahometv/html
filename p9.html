<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HTML 標籤範例</title>

  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      padding: 40px;
      background-color: #f5f5f5;
    }

    .box {
      width: 500px;
      margin: 0 auto;
      padding: 30px;
      background-color: white;
      border-radius: 16px;
      text-align: center;

      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    a {
      display: inline-block;
      margin: 10px;
      color: #0066cc;
      font-size: 18px;
    }

    button {
      margin: 10px;
      padding: 12px 24px;

      background-color: #ff6600;
      color: white;

      border: none;
      border-radius: 8px;

      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background-color: #e65500;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>HTML 標籤示範</h1>

    <!-- 1. img 圖片標籤 -->
    <h2>1. img 圖片</h2>

    <img
      src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80"
      alt="網路風景圖片"
    >


    <!-- 2. a 超連結 -->
    <h2>2. a 超連結</h2>

    <a
      href="https://www.wikipedia.org/"
      target="_blank"
    >
      前往 Wikipedia
    </a>


    <!-- 3. button 按鈕 -->
    <h2>3. button 按鈕</h2>

    <button
      onclick="alert('你按下按鈕了！')"
    >
      點我
    </button>

  </div>

</body>
</html>
